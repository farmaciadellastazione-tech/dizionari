<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dizionario Manarolese</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sea:#1a4a6b; --sea-light:#2a6a9b; --sand:#e8d5b0; --sand-dark:#c4a97a;
    --stone:#4a3f35; --foam:#f5f0e8; --accent:#c0392b; --text:#2c2416;
    --edit-bg:#fffde7; --edit-border:#f9a825;
    --modified:#e8f5e9; --modified-border:#2e7d32;
    --new-bg:#e3f2fd; --new-border:#1565c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Crimson Pro',Georgia,serif; background:var(--foam); color:var(--text); min-height:100vh; }

  header { background:var(--sea); color:white; padding:36px 24px 28px; text-align:center; position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(255,255,255,0.03) 10px,rgba(255,255,255,0.03) 20px); }
  header h1 { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:900; position:relative; }
  header p { font-size:0.95rem; opacity:0.7; margin-top:6px; font-style:italic; position:relative; }
  .header-wave { width:100%; height:28px; background:var(--foam); clip-path:ellipse(55% 100% at 50% 100%); }

  .controls { padding:12px 16px; background:white; border-bottom:1px solid #e0d8cc; display:flex; gap:8px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .search-wrap { flex:1; min-width:160px; position:relative; }
  .search-wrap input { width:100%; padding:8px 12px 8px 34px; border:1.5px solid var(--sand-dark); border-radius:30px; font-family:'Crimson Pro',serif; font-size:0.95rem; background:var(--foam); color:var(--text); outline:none; transition:border-color 0.2s; }
  .search-wrap input:focus { border-color:var(--sea); }
  .search-wrap::before { content:'⚓'; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:0.82rem; opacity:0.5; }
  .count { font-size:0.82rem; color:#888; white-space:nowrap; }
  .btn { padding:7px 14px; border:none; border-radius:30px; cursor:pointer; font-family:'Crimson Pro',serif; font-size:0.88rem; transition:all 0.2s; white-space:nowrap; }
  .btn-sea { background:var(--sea); color:white; }
  .btn-sea:hover { background:var(--sea-light); }
  .btn-green { background:#2e7d32; color:white; }
  .btn-green:hover { background:#388e3c; }
  .btn-blue { background:#1565c0; color:white; }
  .btn-blue:hover { background:#1976d2; }
  .btn-orange { background:#bf360c; color:white; }
  .btn-orange:hover { background:#e64a19; }

  .alpha-nav { display:flex; gap:4px; padding:8px 16px; background:var(--foam); border-bottom:1px solid #e0d8cc; overflow-x:auto; flex-wrap:wrap; }
  .alpha-btn { padding:3px 9px; border:1.5px solid var(--sand-dark); border-radius:20px; cursor:pointer; font-family:'Playfair Display',serif; font-size:0.8rem; font-weight:700; color:var(--stone); background:transparent; transition:all 0.15s; text-decoration:none; }
  .alpha-btn:hover { background:var(--sea); color:white; border-color:var(--sea); }

  main { padding:14px 16px 80px; max-width:860px; margin:0 auto; }

  .letter-section { margin-bottom:8px; }
  .letter-heading { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:900; color:var(--sea); border-bottom:2px solid var(--sand-dark); padding-bottom:3px; margin-bottom:6px; display:flex; align-items:baseline; gap:8px; }
  .letter-heading span { font-family:'Crimson Pro',serif; font-size:0.8rem; font-weight:400; color:#999; }

  .word-card { display:grid; grid-template-columns:150px 1fr auto; align-items:start; gap:8px; padding:8px 10px; border-radius:10px; border-bottom:1px solid rgba(0,0,0,0.06); transition:background 0.15s; }
  .word-card:hover { background:rgba(26,74,107,0.04); }
  .word-card.modified { background:var(--modified); border-left:3px solid var(--modified-border); }
  .word-card.is-new { background:var(--new-bg); border-left:3px solid var(--new-border); }

  .field-wrap { display:flex; flex-direction:column; gap:1px; }
  .field-label { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; color:#bbb; }
  .field-input { border:none; background:transparent; font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; color:var(--sea); width:100%; outline:none; cursor:pointer; border-bottom:1.5px solid transparent; transition:border-color 0.15s; padding:1px 2px; border-radius:3px; }
  .field-input:focus { border-bottom-color:var(--edit-border); background:var(--edit-bg); cursor:text; }
  .field-input.it-field { font-family:'Crimson Pro',serif; font-weight:400; font-style:italic; color:var(--stone); font-size:0.93rem; }
  .field-input.pron-field { font-family:'Crimson Pro',serif; font-weight:400; color:#888; font-size:0.82rem; }

  .card-right { display:flex; align-items:center; gap:5px; padding-top:4px; }
  .btn-play { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--sea); background:white; color:var(--sea); cursor:pointer; font-size:0.78rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; padding:0; }
  .btn-play:hover { background:var(--sea); color:white; }
  .btn-play.playing { background:var(--accent); border-color:var(--accent); color:white; animation:pulse 0.8s infinite; }
  .btn-del { width:24px; height:24px; border-radius:50%; border:1.5px solid #ccc; background:white; color:#aaa; cursor:pointer; font-size:0.65rem; display:flex; align-items:center; justify-content:center; transition:all 0.15s; padding:0; }
  .btn-del:hover { border-color:var(--accent); color:var(--accent); }

  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

  /* Add new word form */
  .add-form { background:white; border:2px dashed var(--sea-light); border-radius:14px; padding:16px; margin-bottom:16px; }
  .add-form h3 { font-family:'Playfair Display',serif; color:var(--sea); margin-bottom:10px; font-size:1.1rem; }
  .add-form .row { display:flex; gap:10px; flex-wrap:wrap; }
  .add-form input { flex:1; min-width:120px; padding:8px 12px; border:1.5px solid var(--sand-dark); border-radius:8px; font-family:'Crimson Pro',serif; font-size:0.95rem; outline:none; }
  .add-form input:focus { border-color:var(--sea); }
  .add-form input::placeholder { color:#ccc; font-style:italic; }

  .info-bar { background:#e3f2fd; border:1px solid #90caf9; border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:0.88rem; color:#1565c0; line-height:1.5; }
  .info-bar strong { display:block; margin-bottom:3px; }
  .stats-bar { background:white; border:1px solid #e0d8cc; border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; gap:20px; flex-wrap:wrap; }
  .stat { display:flex; flex-direction:column; }
  .stat-val { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; color:var(--sea); }
  .stat-lbl { font-size:0.72rem; color:#aaa; }
  .no-results { text-align:center; padding:60px 20px; color:#aaa; font-style:italic; font-size:1.1rem; }
  footer { text-align:center; padding:20px; color:#aaa; font-size:0.82rem; border-top:1px solid #e0d8cc; }
  footer a { color:var(--sea-light); text-decoration:none; }

  @media(max-width:540px) {
    .word-card { grid-template-columns:110px 1fr auto; }
    .field-input { font-size:0.9rem; }
  }
</style>
</head>
<body>

<header>
  <h1>⚓ Dizionario Manarolese</h1>
  <p>Dialetto delle Cinque Terre · Manarola, La Spezia</p>
</header>
<div class="header-wave"></div>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Cerca voce o traduzione..." oninput="filtra()">
  </div>
  <span class="count" id="count"></span>
  <button class="btn btn-sea" onclick="speakAll()">🔊 Leggi tutto</button>
  <button id="btn-gh-save" class="btn btn-blue" onclick="salvaSuGitHub()" style="background:#24292f">☁️ Salva su GitHub</button>
  <button class="btn btn-blue" onclick="salvaFile()" title="Backup locale">💾 Scarica copia</button>
  <button class="btn" onclick="reimpostaToken()" title="Cambia token GitHub" style="background:#eee;color:#666;font-size:0.85em">🔑</button>
  <button class="btn btn-orange" onclick="resetAll()" id="btn-reset" style="display:none">↩ Ripristina tutto</button>
</div>

<div class="alpha-nav" id="alphaNav"></div>
<main id="main"></main>

<footer>
  <p>Dizionario Manarolese · <a href="https://linguaequiz.com">LinguaeQuiz</a></p>
  <p style="margin-top:4px;font-size:0.75rem;">Clicca su qualsiasi campo per modificarlo · Aggiungi nuove voci · Salva il file aggiornato e mandamelo</p>
</footer>

let dati = JSON.parse(JSON.stringify(VOCABOLARIO)); // copia modificabile

function updateStats() {
  const modified = dati.filter((e,i) => {
    const o = VOCABOLARIO[i];
    return o && (e.mn!==o.mn || e.it!==o.it);
  }).length;
  const nuovi = dati.filter(e=>e._new).length;
  const elTotal = document.getElementById('stat-total');
  const elMod = document.getElementById('stat-modified');
  const elNew = document.getElementById('stat-new');
  const elReset = document.getElementById('btn-reset');
  if(elTotal) elTotal.textContent = dati.length;
  if(elMod) elMod.textContent = modified;
  if(elNew) elNew.textContent = nuovi;
  if(elReset) elReset.style.display = (modified>0||nuovi>0) ? '' : 'none';
}

// ── TTS ───────────────────────────────────────────────────────────────────
// Hardening per bug Chrome/Android (cancel + speak immediato perde l'utterance,
// e su Android la voce di default può non essere italiana).
let _voicesReady = false;
function _initVoices(){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.getVoices();
  if('onvoiceschanged' in window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = ()=>{ _voicesReady = true; };
  }
  _voicesReady = window.speechSynthesis.getVoices().length > 0;
}
_initVoices();

function _pickItVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  return voices.find(v => v.lang === 'it-IT')
      || voices.find(v => (v.lang||'').toLowerCase().startsWith('it'))
      || null;
}

function speak(testo, btnEl) {
  if(!testo){ if(btnEl)btnEl.classList.remove('playing'); return; }
  if(!window.speechSynthesis){alert("Sintesi vocale non supportata");return;}
  window.speechSynthesis.cancel();
  document.querySelectorAll('.btn-play').forEach(b=>b.classList.remove('playing'));
  if(btnEl)btnEl.classList.add('playing');
  // Bug Chrome/Android: serve un tick fra cancel() e speak()
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(testo);
    u.lang='it-IT'; u.rate=0.82;
    const v=_pickItVoice(); if(v) u.voice=v;
    u.onend  =()=>{if(btnEl)btnEl.classList.remove('playing');};
    u.onerror=()=>{if(btnEl)btnEl.classList.remove('playing');};
    window.speechSynthesis.speak(u);
  }, 80);
}

// Letto dal bottone 🔊 di una singola card: legge SOLO la parola dialettale
function speakCard(btnEl) {
  const card = btnEl.closest('.word-card');
  if(!card) return;
  const pronEl = card.querySelector('.pron-input');
  const mnEl   = card.querySelector('.mn-input');
  const testo = (pronEl && pronEl.value) || (mnEl && mnEl.value) || '';
  speak(testo, btnEl);
}

function speakAll() {
  const cards=document.querySelectorAll('.word-card');
  if(!cards.length)return;
  window.speechSynthesis.cancel();
  let i=0;
  function next(){
    if(i>=cards.length)return;
    const idx=parseInt(cards[i].dataset.idx);
    const e=dati[idx];
    const btn=cards[i].querySelector('.btn-play');
    cards[i].scrollIntoView({behavior:'smooth',block:'center'});
    document.querySelectorAll('.btn-play').forEach(b=>b.classList.remove('playing'));
    if(btn)btn.classList.add('playing');
    const testo = e.pron || e.mn || '';
    if(!testo){ if(btn)btn.classList.remove('playing'); i++; next(); return; }
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(testo);
      u.lang='it-IT'; u.rate=0.78;
      const v=_pickItVoice(); if(v) u.voice=v;
      u.onend  =()=>{if(btn)btn.classList.remove('playing');i++;next();};
      u.onerror=()=>{if(btn)btn.classList.remove('playing');i++;next();};
      window.speechSynthesis.speak(u);
    }, 80);
  }
  next();
}

// ── Modifica inline ───────────────────────────────────────────────────────
function onEdit(idx, field, value) {
  dati[idx][field]=value;
  const card=document.querySelector(`[data-idx="${idx}"]`);
  if(card){
    const orig=VOCABOLARIO[idx];
    const isModified=orig&&(dati[idx].mn!==orig.mn||dati[idx].it!==orig.it);
    card.classList.toggle('modified', isModified&&!dati[idx]._new);
  }
  updateStats();
}

function deleteEntry(idx) {
  if(!confirm('Eliminare questa voce?'))return;
  dati.splice(idx,1);
  build(currentFilter);
}

function resetAll() {
  if(!confirm('Ripristinare tutte le modifiche? Le voci nuove verranno eliminate.'))return;
  dati=JSON.parse(JSON.stringify(VOCABOLARIO));
  build('');
  document.getElementById('search').value='';
}

// ── Aggiunta nuova voce ───────────────────────────────────────────────────
function aggiungi() {
  const mn=document.getElementById('new-mn').value.trim();
  const it=document.getElementById('new-it').value.trim();
  const pron=document.getElementById('new-pron').value.trim();
  if(!mn||!it){alert('Inserisci almeno la voce manarolese e la traduzione italiana.');return;}
  dati.push({mn,it,pron:pron||mn,_new:true});
  dati.sort((a,b)=>a.mn.localeCompare(b.mn,'it'));
  document.getElementById('new-mn').value='';
  document.getElementById('new-it').value='';
  document.getElementById('new-pron').value='';
  build(currentFilter);
  updateStats();
}

// Configurazione GitHub (puoi modificare questi valori se cambi repo/branch)
const GH_OWNER  = 'farmaciadellastazione-tech';
const GH_REPO   = 'dizionari';
const GH_BRANCH = 'main';
const GH_PATH   = 'dizionario_manarolese.html';
const GH_TOKEN_KEY = 'gh_pat_dizionari'; // chiave localStorage

// Legge i campi correnti dal DOM e ricostruisce l'HTML aggiornato
// IMPORTANTE: catturiamo il sorgente HTML una volta sola, all'avvio della pagina,
// quando il DOM è ancora pulito (bottone non in stato "Salvataggio...", ecc.).
// Lo useremo come TEMPLATE per ricostruisciHtml() invece di leggere il DOM live,
// che cambierebbe ad ogni salvataggio creando feedback loop.
let _ORIG_HTML = null;
async function _caricaTemplateOriginale() {
  try {
    // Scarica il file originale dalla stessa URL della pagina, bypassando la cache
    const res = await fetch(window.location.href + '?_=' + Date.now(), { cache: 'no-store' });
    if (res.ok) _ORIG_HTML = await res.text();
  } catch(e) { console.warn('Caricamento template originale fallito:', e); }
}
// Avviamo subito (in parallelo, non blocca)
_caricaTemplateOriginale();

function ricostruisciHtml() {
  document.querySelectorAll('.word-card').forEach(card=>{
    const idx=parseInt(card.dataset.idx);
    const mnEl=card.querySelector('.mn-input');
    const itEl=card.querySelector('.it-input');
    const pronEl=card.querySelector('.pron-input');
    if(mnEl)dati[idx].mn=mnEl.value;
    if(itEl)dati[idx].it=itEl.value;
    if(pronEl)dati[idx].pron=pronEl.value;
  });

  const datiPuliti=dati.map(e=>{const o={mn:e.mn,it:e.it};if(e.pron&&e.pron!==e.mn)o.pron=e.pron;if(e._new)o._new=true;return o;});
  const nuoviDati=JSON.stringify(datiPuliti);

  // Usiamo SEMPRE il template originale catturato all'avvio, mai il DOM corrente.
  // Se per qualche motivo non è ancora caricato, falliamo invece di rovinare il file.
  if (!_ORIG_HTML) {
    throw new Error('Template originale non ancora caricato. Aspetta qualche secondo e riprova.');
  }
  const src = _ORIG_HTML;
  const start=src.indexOf('//VOCABOLARIO_START');
  const end=src.indexOf('//VOCABOLARIO_END');
  if(start<0||end<0){throw new Error('Marcatori VOCABOLARIO_START/END non trovati nel template');}

  return src.slice(0,start)+'//VOCABOLARIO_START\nconst VOCABOLARIO = '+nuoviDati+';\n'+src.slice(end);
}

// Salva su disco (download nel browser)
function salvaFile() {
  let newSrc;
  try { newSrc = ricostruisciHtml(); }
  catch(e){ alert('Errore: '+e.message); return; }

  const blob=new Blob([newSrc],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dizionario_manarolese.html';
  a.click();
}

// Salva direttamente su GitHub via API
// Helper: fetch con timeout (default 15s). Senza questo, una richiesta che
// non risponde per qualunque motivo resterebbe in pending all'infinito.
function fetchTimeout(url, opts, ms){
  ms = ms || 15000;
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort('timeout'), ms);
  return fetch(url, Object.assign({}, opts, { signal: ctrl.signal }))
    .finally(()=>clearTimeout(tid));
}

async function salvaSuGitHub() {
  let token = localStorage.getItem(GH_TOKEN_KEY);
  if(!token){
    token = prompt('Incolla qui il tuo Personal Access Token GitHub (verrà salvato nel browser, nessuno lo vedrà se non chi usa questo PC):');
    if(!token) return;
    token = token.trim();
    if(!token.startsWith('github_pat_') && !token.startsWith('ghp_')){
      if(!confirm('Il token non sembra avere il formato GitHub atteso. Continuo lo stesso?')) return;
    }
    localStorage.setItem(GH_TOKEN_KEY, token);
  }

  const btn = document.getElementById('btn-gh-save');
  const origText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Salvataggio...'; }

  // Timeout di sicurezza: qualunque cosa accada, dopo 90s il bottone torna disponibile
  // Questo previene il "blocco infinito" anche in caso di errori imprevisti
  const safetyTid = setTimeout(()=>{
    if(btn && btn.disabled){
      console.warn('[GH] Safety timeout 90s - sblocco il bottone');
      btn.disabled = false;
      btn.textContent = origText;
    }
  }, 90000);

  console.log('[GH] Inizio salvataggio. Token formato:', token.slice(0,15)+'...', 'lunghezza:', token.length);

  const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  const headers = {
    'Authorization': 'Bearer '+token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };

  try {
    let newSrc = ricostruisciHtml();
    console.log('[GH] HTML ricostruito, lunghezza:', newSrc.length);

    // STEP 1: GET con timeout per recuperare SHA del file esistente
    console.log('[GH] STEP 1: GET', apiBase);
    let getRes;
    try {
      getRes = await fetchTimeout(apiBase+'?ref='+GH_BRANCH, { headers }, 15000);
    } catch(e){
      if(e.name === 'AbortError' || e === 'timeout'){
        throw new Error('TIMEOUT su GET: la richiesta a GitHub non ha risposto in 15 secondi. Probabile blocco di rete (firewall/proxy/antivirus).');
      }
      throw new Error('Errore di rete su GET: '+(e.message||e));
    }
    console.log('[GH] STEP 1 risposta:', getRes.status, getRes.statusText);

    let sha = null;
    if(getRes.ok){
      const meta = await getRes.json();
      sha = meta.sha;
      console.log('[GH] SHA corrente:', sha);
    } else if(getRes.status === 404){
      console.log('[GH] File non esiste ancora (404), sarà creato');
    } else {
      const errTxt = await getRes.text();
      if(getRes.status === 401){
        if(confirm('Token rifiutato da GitHub (401 Unauthorized). Cancello il token salvato per riprovare con uno nuovo?')){
          localStorage.removeItem(GH_TOKEN_KEY);
        }
      }
      throw new Error('GET fallito ('+getRes.status+'): '+errTxt);
    }

    // STEP 2: codifica base64 (TextEncoder per gestire unicode)
    const bytes = new TextEncoder().encode(newSrc);
    let bin=''; for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    const b64 = btoa(bin);
    console.log('[GH] STEP 2: contenuto codificato, base64 length:', b64.length);

    const putBody = {
      message: 'Aggiornamento dizionario manarolese da web ('+new Date().toISOString().slice(0,19).replace('T',' ')+')',
      content: b64,
      branch: GH_BRANCH
    };
    if(sha) putBody.sha = sha;

    // STEP 3: PUT con timeout (più lungo perché upload di ~400 KB)
    console.log('[GH] STEP 3: PUT', apiBase);
    let putRes;
    try {
      putRes = await fetchTimeout(apiBase, {
        method: 'PUT',
        headers: Object.assign({}, headers, {'Content-Type':'application/json'}),
        body: JSON.stringify(putBody)
      }, 30000);
    } catch(e){
      if(e.name === 'AbortError' || e === 'timeout'){
        throw new Error('TIMEOUT su PUT: la scrittura su GitHub non ha risposto in 30 secondi. Probabile blocco firewall/proxy.');
      }
      throw new Error('Errore di rete su PUT: '+(e.message||e));
    }
    console.log('[GH] STEP 3 risposta:', putRes.status, putRes.statusText);

    if(!putRes.ok){
      const errTxt = await putRes.text();
      if(putRes.status === 401){
        if(confirm('Token rifiutato da GitHub (401). Cancello il token salvato?')){
          localStorage.removeItem(GH_TOKEN_KEY);
        }
      }
      throw new Error('PUT fallito ('+putRes.status+'): '+errTxt);
    }

    console.log('[GH] ✅ Salvataggio completato');
    clearTimeout(safetyTid);
    if(btn){ btn.textContent = '✅ Salvato!'; setTimeout(()=>{ btn.textContent=origText; btn.disabled=false; }, 2500); }
  } catch(err) {
    console.error('[GH] Errore:', err);
    clearTimeout(safetyTid);
    alert('Errore salvataggio:\n\n'+err.message);
    if(btn){ btn.textContent=origText; btn.disabled=false; }
  }
}

  if(confirm('Cancellare il token GitHub salvato in questo browser?\nDovrai reincollarlo al prossimo salvataggio.')){
    localStorage.removeItem(GH_TOKEN_KEY);
    alert('Token rimosso.');
  }
}

  const filtered=dati.map((e,i)=>({e,i})).filter(({e})=>
    !q||(e.mn.toLowerCase().includes(q)||e.it.toLowerCase().includes(q))
  );
  
  const main=document.getElementById('main');
  
  if(!filtered.length){
    main.innerHTML=`
      <div class="add-form">
        <h3>➕ Aggiungi nuova voce</h3>
        <div class="row">
          <input id="new-mn" placeholder="Voce manarolese" autocomplete="off">
          <input id="new-it" placeholder="Traduzione italiana" autocomplete="off">
          <input id="new-pron" placeholder="Pronuncia TTS (opzionale)" autocomplete="off">
          <button class="btn btn-blue" onclick="aggiungi()">Aggiungi</button>
        </div>
      </div>
      <div class="no-results">Nessun risultato trovato ⚓</div>`;
    document.getElementById('count').textContent='0 voci';
    updateStats();
    return;
  }
  
  // Raggruppa per lettera
  const groups={};
  filtered.forEach(({e,i})=>{
    const l=e.mn[0].toUpperCase();
    if(!groups[l])groups[l]=[];
    groups[l].push({e,i});
  });
  const letters=Object.keys(groups).sort();
  
  // Alpha nav
  document.getElementById('alphaNav').innerHTML=letters.map(l=>
    `<a class="alpha-btn" href="#letter-${l}">${l}</a>`
  ).join('');
  
  const statsHtml=`
    <div class="stats-bar">
      <div class="stat"><span class="stat-val" id="stat-total">${dati.length}</span><span class="stat-lbl">Voci totali</span></div>
      <div class="stat"><span class="stat-val" id="stat-modified">0</span><span class="stat-lbl">Modificate</span></div>
      <div class="stat"><span class="stat-val" id="stat-new">0</span><span class="stat-lbl">Nuove</span></div>
    </div>
    <div class="info-bar">
      <strong>✏️ Come usare:</strong>
      Clicca su qualsiasi campo per modificarlo. Usa "Aggiungi nuova voce" per inserire parole mancanti. Quando hai finito clicca <strong>☁️ Salva su GitHub</strong> per pubblicare le modifiche online (visibili da tutti i tuoi computer). <strong>💾 Scarica copia</strong> serve solo per un backup locale.
    </div>
    <div class="add-form">
      <h3>➕ Aggiungi nuova voce</h3>
      <div class="row">
        <input id="new-mn" placeholder="Voce manarolese" autocomplete="off">
        <input id="new-it" placeholder="Traduzione italiana" autocomplete="off">
        <input id="new-pron" placeholder="Pronuncia TTS (opzionale)" autocomplete="off">
        <button class="btn btn-blue" onclick="aggiungi()">Aggiungi</button>
      </div>
    </div>`;
  
  const cardsHtml=letters.map(l=>`
    <div class="letter-section" id="letter-${l}">
      <div class="letter-heading">${l} <span>${groups[l].length}</span></div>
      ${groups[l].map(({e,i})=>{
        const orig=VOCABOLARIO[i];
        const isModified=orig&&(e.mn!==orig.mn||e.it!==orig.it)&&!e._new;
        return `
        <div class="word-card ${isModified?'modified':''} ${e._new?'is-new':''}" data-idx="${i}">
          <div class="field-wrap">
            <span class="field-label">Manarolese ${e._new?'🆕':''}</span>
            <input class="field-input mn-input" type="text" value="${e.mn.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
              title="Clicca per modificare" onchange="onEdit(${i},'mn',this.value)" onfocus="this.select()">
          </div>
          <div>
            <div class="field-wrap" style="margin-bottom:3px">
              <span class="field-label">Italiano</span>
              <input class="field-input it-field it-input" type="text" value="${e.it.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
                title="Clicca per modificare" onchange="onEdit(${i},'it',this.value)" onfocus="this.select()">
            </div>
            <div class="field-wrap">
              <span class="field-label">Pronuncia TTS</span>
              <input class="field-input pron-field pron-input" type="text" value="${(e.pron||e.mn).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
                title="Correzione fonetica per la lettura" onchange="onEdit(${i},'pron',this.value)" onfocus="this.select()">
            </div>
          </div>
          <div class="card-right">
            <button class="btn-play" onclick="speakCard(this)" title="Pronuncia">🔊</button>
            <button class="btn-del" onclick="deleteEntry(${i})" title="Elimina voce">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
  
  main.innerHTML=statsHtml+cardsHtml;
  document.getElementById('count').textContent=`${filtered.length} voci`;
  updateStats();
}

function filtra(){build(document.getElementById('search').value);}

// Init
build('');
</script>
</body>
</html>
